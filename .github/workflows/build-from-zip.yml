name: Build ReyGameTurbo RGT from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -print)

          if [ "${#zips[@]}" -eq 0 ]; then
            echo '::error::No project ZIP found in repository root.'
            exit 1
          fi

          if [ "${#zips[@]}" -gt 1 ]; then
            echo '::error::More than one project ZIP found in repository root. Keep exactly one ZIP.'
            printf ' - %s\n' "${zips[@]}"
            exit 1
          fi

          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"
          echo "Using ZIP: ${zips[0]}"

      - name: Extract project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          EXTRACT_DIR="$RUNNER_TEMP/rgt-extracted"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "${{ steps.zip.outputs.zip }}" -d "$EXTRACT_DIR"
          echo "extract_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.extract.outputs.extract_dir }}"

          mapfile -t settings_files < <(find "$ROOT" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print)

          if [ "${#settings_files[@]}" -eq 0 ]; then
            echo '::error::No settings.gradle.kts or settings.gradle found inside the ZIP.'
            exit 1
          fi

          if [ "${#settings_files[@]}" -gt 1 ]; then
            echo '::error::Multiple Gradle roots found inside the ZIP.'
            printf ' - %s\n' "${settings_files[@]}"
            exit 1
          fi

          PROJECT_ROOT="$(dirname "${settings_files[0]}")"

          [ -d "$PROJECT_ROOT/app" ] || { echo '::error::app module not found.'; exit 1; }
          [ -f "$PROJECT_ROOT/app/build.gradle.kts" ] || [ -f "$PROJECT_ROOT/app/build.gradle" ] || { echo '::error::app/build.gradle(.kts) not found.'; exit 1; }
          [ -f "$PROJECT_ROOT/gradlew" ] || { echo '::error::gradlew not found.'; exit 1; }

          chmod +x "$PROJECT_ROOT/gradlew"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_ROOT"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -type f -name '*.apk' -print)

          if [ "${#apks[@]}" -eq 0 ]; then
            echo '::error::Gradle completed but no debug APK was generated.'
            exit 1
          fi

          if [ "${#apks[@]}" -gt 1 ]; then
            echo '::error::More than one debug APK was generated unexpectedly.'
            printf ' - %s\n' "${apks[@]}"
            exit 1
          fi

          echo "apk=${apks[0]}" >> "$GITHUB_OUTPUT"
          ls -lh "${apks[0]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReyGameTurbo-RGT-debug-apk
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
